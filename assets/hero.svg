  <rect x="95" y="118" width="210" height="120" rx="5" fill="url(#scr)"/>
  <circle cx="106" cy="127" r="3" fill="#ff5f56"/><circle cx="117" cy="127" r="3" fill="#ffbd2e"/><circle cx="128" cy="127" r="3" fill="#27c93f"/>
  <g>
    <rect x="108" y="142" width="80" height="6" rx="3" fill="#58a6ff"><animate attributeName="width" values="0;80;80;0" keyTimes="0;0.3;0.9;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="120" y="156" width="120" height="6" rx="3" fill="#bc8cff"><animate attributeName="width" values="0;0;120;120;0" keyTimes="0;0.2;0.45;0.9;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="120" y="170" width="90" height="6" rx="3" fill="#3fb950"><animate attributeName="width" values="0;0;90;90;0" keyTimes="0;0.4;0.6;0.9;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="108" y="184" width="140" height="6" rx="3" fill="#f78166"><animate attributeName="width" values="0;0;140;140;0" keyTimes="0;0.55;0.75;0.9;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="108" y="198" width="60" height="6" rx="3" fill="#58a6ff"><animate attributeName="width" values="0;0;60;60;0" keyTimes="0;0.7;0.85;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="108" y="214" width="8" height="12" fill="#e6edf3"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <path d="M60 248 H340 L330 262 H70 Z" fill="#30363d"/>
  <!-- chair -->
  <rect x="470" y="140" width="40" height="125" rx="14" fill="#161b22" stroke="#30363d"/>
