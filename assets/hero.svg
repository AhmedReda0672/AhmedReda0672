      <ellipse cx="436" cy="130" rx="4" ry="5"><animate attributeName="ry" values="5;5;0.5;5;5" keyTimes="0;0.45;0.5;0.55;1" dur="4s" repeatCount="indefinite"/></ellipse>
    </g>
    <path d="M418 146 Q427 151 436 146" stroke="#8b949e" stroke-width="2" fill="none" stroke-linecap="round"/>
