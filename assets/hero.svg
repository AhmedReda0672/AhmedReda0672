  <rect x="30" y="262" width="540" height="10" rx="5" fill="#21262d"/>
  <rect x="60" y="272" width="10" height="38" fill="#161b22"/><rect x="530" y="272" width="10" height="38" fill="#161b22"/>
  <!-- laptop -->
