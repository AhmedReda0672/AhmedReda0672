  <path d="M450 195 L378 222" stroke="#2f3e66" stroke-width="16" stroke-linecap="round" fill="none">
    <animate attributeName="d" values="M450 195 L378 222;M450 195 L378 222;M450 195 L395 160;M450 195 L395 160;M450 195 L378 222" keyTimes="0;0.4;0.55;0.75;1" dur="8s" repeatCount="indefinite"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;17 -62;17 -62;0 0" keyTimes="0;0.4;0.55;0.75;1" dur="8s" repeatCount="indefinite"/>
    <rect x="355" y="205" width="30" height="34" rx="5" fill="#e6edf3"/>
    <path d="M385 213 q14 0 14 12 q0 12 -14 12" stroke="#e6edf3" stroke-width="4" fill="none"/>
    <rect x="357" y="207" width="26" height="8" rx="3" fill="#6f4e37"/>
    <g stroke="#8b949e" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M363 195 q-6 -10 0 -18 q6 -8 0 -16"><animate attributeName="opacity" values="0;0.9;0" dur="2.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -8" dur="2.4s" repeatCount="indefinite"/></path>
      <path d="M377 195 q-6 -10 0 -18 q6 -8 0 -16"><animate attributeName="opacity" values="0;0.9;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -8" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></path>
    </g>
  </g>
  <!-- floating code symbols -->
  <g font-family="monospace" font-size="16" fill="#58a6ff" opacity="0.7">
    <text x="330" y="90">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4s" repeatCount="indefinite"/></text>
    <text x="545" y="190" fill="#bc8cff">{ }<animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5s" repeatCount="indefinite"/></text>
    <text x="45" y="95" fill="#3fb950">SQL<animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.5s" repeatCount="indefinite"/></text>
  </g>
